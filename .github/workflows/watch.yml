name: job-watch
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: job-watch
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 job_watch.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save state
        run: |
          git config user.name job-watch
          git config user.email job-watch@users.noreply.github.com
          git add state
          git diff --cached --quiet || (git commit -m "state $(date -u +%FT%TZ)" && git push)
